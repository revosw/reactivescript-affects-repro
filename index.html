<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>affects on a keyed source</title>
		<style>
			body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; color: #111; background: #fff; max-width: 760px; }
			h1 { font-size: 20px; margin: 0 0 4px; }
			.variant { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; margin-bottom: 16px; }
			.variant.bug { background: #fde2e1; color: #8a1c14; }
			.variant.fixed { background: #dcf5e3; color: #11602b; }
			table { border-collapse: collapse; margin: 8px 0 12px; }
			td, th { border: 1px solid #ccc; padding: 4px 12px; text-align: left; }
			button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid #888; background: #f4f4f4; cursor: pointer; }
			.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 16px 0; }
			.facts dt { color: #555; }
			.facts dd { margin: 0; font-weight: 600; }
			.yes { color: #11602b; } .no { color: #555; } .err { color: #8a1c14; }
			#log { background: #f6f6f6; border: 1px solid #ddd; padding: 8px 12px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; min-height: 6em; }
		</style>
	</head>
	<body>
		<h1>ReactiveScript: <code>affects</code> on a keyed source</h1>
		<div id="variant"></div>
		<div id="app"></div>
		<h2 style="font-size: 15px; margin: 20px 0 4px">Log (written by the TypeScript API)</h2>
		<div id="log"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
